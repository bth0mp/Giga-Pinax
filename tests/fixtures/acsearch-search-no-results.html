<!DOCTYPE html>
<!--
  A hand-written stand-in for the acsearch page a search with no hits returns: no results array at all, only the "No results found" heading, and the
  same signed-out account menu as the results page. Nothing here is copied from acsearch.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>acsearch.info - Auction research</title>
  </head>
  <body class="body-has-fixed-title">
    <nav class="navbar">
      <ul class="nav navbar-nav navbar-right">
        <li>
          <a href="login.html">
            <span class="hidden-sm">Log in</span>
          </a>
        </li>
      </ul>
    </nav>

    <div id="search-container">
      <div id="search-left">
        <h2>No results found</h2>
        <p>Your search returned no lots. Try fewer words.</p>
      </div>
    </div>

    <script type="text/javascript">
      acsearch.searchItemsPerPage = 100;
      acsearch.dict.searchLoginRequired = 'Log\x20in';
    </script>
  </body>
</html>
