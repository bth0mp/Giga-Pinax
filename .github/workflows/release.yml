name: Release

on:
  push:
    tags:
      - 'v*'

# Nothing is granted by default: each job names the one scope it needs, and only the job that uploads can write.
permissions: {}

# Actions are pinned to full commit SHAs (the release in the trailing comment); .github/dependabot.yml proposes updates.
jobs:
  # Tests and builds the five ZIPs once, and records their checksums. Read-only: it runs the test suites and the build,
  # and nothing it runs could reach the release.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and the job runs on a tag anybody with write access can move: the checkout leaves no
          # credential in .git/config for a later step, or a compromised one, to push with.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      # The packages are named from the manifests, so a tag that disagrees would upload
      # giga-pinax-brave-<manifest version>.zip to a release named after a different one. Fail before building.
      - name: Check the tag matches the manifest version
        run: |
          manifest_version="$(python -c 'import json; print(json.load(open("manifests/brave.json"))["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME carries version $tag_version, but manifests/brave.json says $manifest_version" >&2
            exit 1
          fi
      # Pinned: tests/test_icons.py compares the committed PNGs with a fresh render, so the renderer must not move.
      - name: Install Pillow for the icon render test
        run: python -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build the packages
        run: python scripts/build.py
      # The checksums leave this job twice: in the artifact beside the ZIPs, and as this job's output, which no later
      # job can change. The release job checks the artifact against the output before it uploads anything.
      - name: Record the checksums of the five ZIPs
        id: sums
        working-directory: dist
        run: |
          sha256sum giga-pinax-*.zip > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          {
            echo 'sums<<SHA256SUMS_END'
            cat SHA256SUMS
            echo 'SHA256SUMS_END'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: |
            dist/giga-pinax-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  # Lints the Firefox package exactly as it was built. It installs the pinned web-ext tree from npm, so this job holds
  # no write scope; the checkout is only for tools/web-ext, and the package it lints is the artifact.
  lint:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      # web-ext and its whole dependency tree are pinned, with integrity hashes, in tools/web-ext/package-lock.json.
      - name: Install the pinned web-ext
        run: npm ci --prefix tools/web-ext --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: dist
      - name: Unpack the versioned Firefox package
        run: unzip -q dist/giga-pinax-firefox-"${GITHUB_REF_NAME#v}".zip -d firefox
      # --self-hosted: the package names its own update manifest (browser_specific_settings.gecko.update_url), which
      # the linter refuses only for an add-on addons.mozilla.org would host.
      - name: Lint the Firefox package
        run: tools/web-ext/node_modules/.bin/web-ext lint --source-dir firefox --warnings-as-errors --self-hosted

  # Signs the Firefox package with Mozilla as an unlisted, self-distributed add-on when the repository holds the secrets
  # AMO_JWT_ISSUER and AMO_JWT_SECRET, and does nothing else without them. It can only read the repository, and the
  # credentials reach the one step that signs, which runs the web-ext installed from the lockfile before them. The
  # environment amo-signing is where the owner can require a person's approval before this job runs (an environment
  # nobody has configured changes nothing). The signed XPI and the update manifest Firefox reads for it
  # (scripts/build_site.py update-manifest) leave as an artifact with their checksums, which the release job checks.
  # sign-firefox.yml signs a release that was tagged before the secrets existed.
  sign:
    needs: [build, lint]
    runs-on: ubuntu-latest
    environment: amo-signing
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.credentials.outputs.present }}
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      # Only whether both exist reaches this step, as a boolean the expression computes; neither value does.
      - name: Check for the AMO credentials
        id: credentials
        env:
          PRESENT: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
        run: |
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$PRESENT" != 'true' ]; then
            echo '::notice::No AMO_JWT_ISSUER and AMO_JWT_SECRET secrets, so the Firefox package is not signed.'
          fi
      - if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.credentials.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - if: steps.credentials.outputs.present == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      # Installed before any step holds a credential; the signing step runs this binary and fetches nothing.
      - name: Install the pinned web-ext
        if: steps.credentials.outputs.present == 'true'
        run: npm ci --prefix tools/web-ext --no-audit --no-fund
      - if: steps.credentials.outputs.present == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: dist
      - name: Unpack the versioned Firefox package
        if: steps.credentials.outputs.present == 'true'
        run: unzip -q dist/giga-pinax-firefox-"${GITHUB_REF_NAME#v}".zip -d firefox
      # Mozilla signs one version once: a second run for the same version is refused, and docs/RELEASING.md says how to
      # fetch the signed file from the developer hub instead.
      - name: Sign the Firefox package with Mozilla (unlisted)
        if: steps.credentials.outputs.present == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # --no-config-discovery: no web-ext config file in the checkout or the home directory can reconfigure it.
        run: tools/web-ext/node_modules/.bin/web-ext sign --no-config-discovery --source-dir firefox --channel unlisted --artifacts-dir web-ext-artifacts
      - name: Name the signed package and write its update manifest
        if: steps.credentials.outputs.present == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          set -- web-ext-artifacts/*.xpi
          test "$#" -eq 1 && test -f "$1"
          mkdir signed
          mv "$1" "signed/giga-pinax-firefox-$version.xpi"
          python scripts/build_site.py update-manifest --xpi "signed/giga-pinax-firefox-$version.xpi" --output signed/firefox-updates.json
      - name: Record the checksums of the signed package and its update manifest
        if: steps.credentials.outputs.present == 'true'
        id: sums
        working-directory: signed
        run: |
          sha256sum giga-pinax-firefox-*.xpi firefox-updates.json > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
          {
            echo 'sums<<SHA256SUMS_END'
            cat SHA256SUMS
            echo 'SHA256SUMS_END'
          } >> "$GITHUB_OUTPUT"
      - if: steps.credentials.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: |
            signed/giga-pinax-firefox-*.xpi
            signed/firefox-updates.json
            signed/SHA256SUMS
          if-no-files-found: error

  # Uploads the ZIPs the build job made, once the checksums prove they are those ZIPs, and the signed XPI and its update
  # manifest when the sign job made them. No checkout, no npm and no code from the repository run here: the write scope
  # is held only by gh and the checksum checks. A signing that failed does not hold back the ZIPs: the draft is filled
  # without the XPI, and the run says so.
  release:
    needs: [build, lint, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.lint.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNED: ${{ needs.sign.result == 'success' && needs.sign.outputs.signed == 'true' }}
      SIGN_RESULT: ${{ needs.sign.result }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: dist
      - name: Check the ZIPs are the ones the build job made
        working-directory: dist
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          # The output comes back without its last line break, or with it: blank lines are dropped either way.
          printf '%s\n' "$SUMS" | sed '/^$/d' > expected.sums
          test "$(wc -l < expected.sums)" -eq 5
          cmp expected.sums SHA256SUMS
          sha256sum --check --strict expected.sums
          # Exactly the five ZIPs the sums name, and nothing else that the upload's pattern would pick up.
          test "$(ls giga-pinax-*.zip | wc -l)" -eq 5
      - if: env.SIGNED == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: signed
      - name: Check the signed package is the one the sign job made
        if: env.SIGNED == 'true'
        working-directory: signed
        env:
          SUMS: ${{ needs.sign.outputs.sums }}
        run: |
          printf '%s\n' "$SUMS" | sed '/^$/d' > expected.sums
          test "$(wc -l < expected.sums)" -eq 2
          cmp expected.sums SHA256SUMS
          sha256sum --check --strict expected.sums
          test -f "giga-pinax-firefox-${GITHUB_REF_NAME#v}.xpi"
      # The draft is never published here: a person checks the assets and the notes, then publishes.
      - name: Attach the packages to the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A published release is somebody's decision and its assets are what people have already downloaded: this job
          # only ever fills a draft. A tag re-pushed at a published release uploads nothing and says why.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)" != "true" ]; then
              echo "release $GITHUB_REF_NAME is already published; refusing to replace its assets" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes 'Draft release. Add the notes and the install instructions from docs/RELEASING.md, then publish.'
          fi
          gh release upload "$GITHUB_REF_NAME" dist/giga-pinax-*.zip --clobber
          if [ "$SIGNED" = 'true' ]; then
            gh release upload "$GITHUB_REF_NAME" "signed/giga-pinax-firefox-${GITHUB_REF_NAME#v}.xpi" signed/firefox-updates.json --clobber
          elif [ "$SIGN_RESULT" != 'success' ]; then
            echo "::warning::Signing the Firefox package did not succeed ($SIGN_RESULT), so the draft carries no signed XPI. See docs/RELEASING.md."
          fi
