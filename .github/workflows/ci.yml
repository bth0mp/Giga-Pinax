name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the checkout; it publishes nothing and needs no write scope.
permissions:
  contents: read

# A branch pushed while its pull request is open would otherwise run twice over; keep only the newest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      # Pinned: tests/test_icons.py compares the committed PNGs with a fresh render, so the renderer must not move.
      - name: Install Pillow for the icon render test
        run: python -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build the packages
        run: python scripts/build.py
      # web-ext and its whole dependency tree are pinned, with integrity hashes, in tools/web-ext/package-lock.json.
      - name: Install the pinned web-ext
        run: npm ci --prefix tools/web-ext --no-audit --no-fund
      # --self-hosted: the package names its own update manifest, which the linter refuses only for an AMO-hosted add-on.
      - name: Lint the Firefox package
        run: tools/web-ext/node_modules/.bin/web-ext lint --source-dir dist/firefox --warnings-as-errors --self-hosted

  # The JSDoc types of the store, core/ and the page modules (jsconfig.json), checked with no build step: nothing is
  # emitted and the extension ships as it is. TypeScript is pinned, with its integrity hash, in
  # tools/typescript/package-lock.json and installed with npm ci, as web-ext is.
  types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Install the pinned TypeScript
        run: npm ci --prefix tools/typescript --no-audit --no-fund
      - name: Check the types
        run: tools/typescript/node_modules/.bin/tsc -p jsconfig.json --noEmit
