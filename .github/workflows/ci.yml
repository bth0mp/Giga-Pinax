name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the checkout; it publishes nothing and needs no write scope.
permissions:
  contents: read

# A branch pushed while its pull request is open would otherwise run twice over; keep only the newest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      # Pinned: tests/test_icons.py compares the committed PNGs with a fresh render, so the renderer must not move.
      - name: Install Pillow for the icon render test
        run: python -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build the packages
        run: python scripts/build.py
      - name: Lint the Firefox package
        run: npx --yes web-ext@10.6.0 lint --source-dir dist/firefox --warnings-as-errors
