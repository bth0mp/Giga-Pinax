name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned: tests/test_icons.py compares the committed PNGs with a fresh render, so the renderer must not move.
      - name: Install Pillow for the icon render test
        run: python -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build the packages
        run: python scripts/build.py
      - name: Lint the Firefox package
        run: npx --yes web-ext@10.6.0 lint --source-dir dist/firefox --warnings-as-errors
