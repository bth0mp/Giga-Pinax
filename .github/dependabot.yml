# The workflows pin each action to a full commit SHA. Dependabot proposes each new release as a pull request, so an
# action moves only when a person has reviewed the change and merged it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The web-ext the workflows lint and sign with, pinned with its whole tree in tools/web-ext/package-lock.json.
  - package-ecosystem: npm
    directory: /tools/web-ext
    schedule:
      interval: weekly
